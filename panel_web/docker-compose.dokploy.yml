# =============================================================================
# Panel web público — variante para Dokploy / Traefik
# =============================================================================
# Este archivo NO incluye Caddy: Dokploy/Traefik ya escucha 80/443.
# En Dokploy usa este compose como "Compose Path":
#   panel_web/docker-compose.dokploy.yml
# Luego asigna el dominio al servicio `panel-web`, puerto 8000.
#
# Si despliegas fuera de Dokploy y necesitas TLS propio, usa docker-compose.yml
# (incluye Caddy) en lugar de este archivo.
# =============================================================================
name: pdf-separator

services:
  panel-init:
    image: alpine:3.19
    container_name: pdfsep-init
    restart: "no"
    command:
      - sh
      - -c
      - |
        mkdir -p /data/users /data/inventarios
        chown -R 1000:1000 /data
        find /data -type d -exec chmod 700 {} +
        find /data -type f -exec chmod 600 {} +
    volumes:
      - panel_data:/data
    networks:
      - panelnet

  # Descarga los modelos de PaddleOCR UNA vez al volumen. El worker corre luego
  # con network_mode: none y ya no necesita internet.
  panel-warmup:
    image: pdf-separator-web:local
    container_name: pdfsep-warmup
    restart: "no"
    command:
      - python3
      - /separador_pdfs/panel/warmup_ocr.py
    environment:
      HOME: /data
    volumes:
      - panel_data:/data
    depends_on:
      panel-init:
        condition: service_completed_successfully
      panel-web:
        condition: service_started
    networks:
      - panelnet

  panel-web:
    build:
      context: ..
      dockerfile: panel_web/Dockerfile
    image: pdf-separator-web:local
    container_name: pdfsep-web
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - panel_data:/data
    depends_on:
      panel-init:
        condition: service_completed_successfully
    networks:
      - panelnet
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # HTTP -> HTTPS
      - traefik.http.routers.pdfsep.rule=Host(`pdf-separator.duckdns.org`)
      - traefik.http.routers.pdfsep.entrypoints=web
      - traefik.http.routers.pdfsep.middlewares=redirect-to-https@file
      # HTTPS con Let's Encrypt (Traefik de Dokploy)
      - traefik.http.routers.pdfsep-secure.rule=Host(`pdf-separator.duckdns.org`)
      - traefik.http.routers.pdfsep-secure.entrypoints=websecure
      - traefik.http.routers.pdfsep-secure.tls=true
      - traefik.http.routers.pdfsep-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.pdfsep-secure.middlewares=pdfsep-body,pdfsep-rate,pdfsep-inflight
      - traefik.http.middlewares.pdfsep-body.buffering.maxRequestBodyBytes=57671680
      - traefik.http.middlewares.pdfsep-body.buffering.memRequestBodyBytes=1048576
      - traefik.http.middlewares.pdfsep-rate.ratelimit.average=60
      - traefik.http.middlewares.pdfsep-rate.ratelimit.burst=120
      - traefik.http.middlewares.pdfsep-inflight.inflightreq.amount=64
      - traefik.http.services.pdfsep.loadbalancer.server.port=8000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m
    mem_limit: 1g

  panel-worker:
    image: pdf-separator-web:local
    container_name: pdfsep-worker
    restart: unless-stopped
    command: ["python3", "-m", "app.worker"]
    # El OCR no recibe secretos Microsoft ni la clave de firma de sesiones.
    environment:
      DATA_DIR: ${DATA_DIR:-/data}
      DB_PATH: ${DB_PATH:-}
      INVENTORY_DIR: ${INVENTORY_DIR:-}
      SEPARATOR_CODE_DIR: ${SEPARATOR_CODE_DIR:-/separador_pdfs}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Mexico_City}
      OCR_WORKERS: ${OCR_WORKERS:-2}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-7200}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      AVG_SECONDS_PER_PAGE: ${AVG_SECONDS_PER_PAGE:-12}
      PANEL_OCR_SOLO_SN: ${PANEL_OCR_SOLO_SN:-1}
      PANEL_OCR_FRANJA: ${PANEL_OCR_FRANJA:-0.35}
      PANEL_OCR_SECUENCIAL: ${PANEL_OCR_SECUENCIAL:-0}
      PANEL_OCR_BANDAS: ${PANEL_OCR_BANDAS:-4}
    volumes:
      - panel_data:/data
    depends_on:
      panel-init:
        condition: service_completed_successfully
      panel-warmup:
        condition: service_completed_successfully
    # El worker no necesita red: solo volumen y CPU. Los modelos ya están en /data.
    network_mode: "none"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=1g
    shm_size: "512m"
    mem_limit: 4g

networks:
  panelnet:
    driver: bridge
  # Red de Dokploy/Traefik (ya existe en el host): permite enrutar el dominio
  # pdf-separator.duckdns.org sin publicar puertos en el host.
  dokploy-network:
    external: true

volumes:
  panel_data:
