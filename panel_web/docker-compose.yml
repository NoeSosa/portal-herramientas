# =============================================================================
# Panel web público del separador
# =============================================================================
# - panel-web y panel-worker NO publican puertos.
# - Solo Caddy publica 80/443 y obtiene el certificado de Let's Encrypt.
# - El worker no monta el workspace de OpenClaw: solo /separador_pdfs en ro.
# - Si se despliega con Dokploy/Traefik, quitar el servicio caddy y publicar
#   panel-web por la red de Dokploy.
# =============================================================================
name: pdf-separator

services:
  panel-init:
    image: alpine:3.24.3
    container_name: pdfsep-init
    restart: "no"
    command:
      - sh
      - -c
      - |
        mkdir -p /data/users /data/inventarios
        chown -R 1000:1000 /data
        find /data -type d -exec chmod 700 {} +
        find /data -type f -exec chmod 600 {} +
    volumes:
      - panel_data:/data
    networks:
      - panelnet

  # Descarga los modelos de PaddleOCR UNA vez al volumen. El worker corre luego
  # con network_mode: none y ya no necesita internet.
  panel-warmup:
    image: pdf-separator-web:local
    container_name: pdfsep-warmup
    restart: "no"
    command:
      - python3
      - /separador_pdfs/panel/warmup_ocr.py
    environment:
      HOME: /data
    volumes:
      - panel_data:/data
    depends_on:
      panel-init:
        condition: service_completed_successfully
      panel-web:
        condition: service_started
    networks:
      - panelnet

  panel-web:
    build:
      context: ..
      dockerfile: panel_web/Dockerfile
    image: pdf-separator-web:local
    container_name: pdfsep-web
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - panel_data:/data
    depends_on:
      panel-init:
        condition: service_completed_successfully
    networks:
      - panelnet
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m
    mem_limit: 1g

  panel-worker:
    image: pdf-separator-web:local
    container_name: pdfsep-worker
    restart: unless-stopped
    command: ["python3", "-m", "app.worker"]
    # El OCR no recibe secretos Microsoft ni la clave de firma de sesiones.
    environment:
      DATA_DIR: ${DATA_DIR:-/data}
      DB_PATH: ${DB_PATH:-}
      INVENTORY_DIR: ${INVENTORY_DIR:-}
      SEPARATOR_CODE_DIR: ${SEPARATOR_CODE_DIR:-/separador_pdfs}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Mexico_City}
      OCR_WORKERS: ${OCR_WORKERS:-2}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-7200}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      AVG_SECONDS_PER_PAGE: ${AVG_SECONDS_PER_PAGE:-12}
      PANEL_OCR_SOLO_SN: ${PANEL_OCR_SOLO_SN:-1}
      PANEL_OCR_FRANJA: ${PANEL_OCR_FRANJA:-0.35}
      PANEL_OCR_SECUENCIAL: ${PANEL_OCR_SECUENCIAL:-0}
      PANEL_OCR_BANDAS: ${PANEL_OCR_BANDAS:-4}
    volumes:
      - panel_data:/data
    depends_on:
      panel-init:
        condition: service_completed_successfully
      panel-warmup:
        condition: service_completed_successfully
    # El worker no necesita red: solo volumen y CPU. Los modelos ya están en /data.
    network_mode: "none"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=1g
    shm_size: "512m"
    mem_limit: 4g

  caddy:
    image: caddy:2-alpine
    container_name: pdfsep-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-pdf-separator.duckdns.org}
      ACME_EMAIL: ${ACME_EMAIL:-admin@pdf-separator.duckdns.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - panel-web
    networks:
      - panelnet

networks:
  panelnet:
    driver: bridge

volumes:
  panel_data:
  caddy_data:
  caddy_config:
