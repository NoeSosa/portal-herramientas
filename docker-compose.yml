# =============================================================================
# Portal de Herramientas — Docker Compose
# =============================================================================
# ⚠️ DISEÑO DE SEGURIDAD:
#   - Ningún servicio lleva labels de Traefik → NADA se publica a internet.
#   - Solo `frontend` publica un puerto, y es 127.0.0.1 (loopback del host).
#   - Acceso exclusivo por túnel SSH:
#       ssh -L 8080:127.0.0.1:8080 -i llave.key ubuntu@<servidor>
#
#   Si algún día quieres exponerlo por Dokploy/Traefik, añade labels como en
#   los otros proyectos, pero NO antes de poner autenticación.
#
# ⚠️ NADA de este archivo debe usar nombres de contenedor que ya existan en el
#   servidor (pihole, tailscale, dokploy-*, openclaw-*, stirling-*, san_pedro_*,
#   traductor_*, whatsapp-bot). Este stack es 100% independiente.
# =============================================================================

name: herramientas-web

services:
  # --- Inicializador: prepara permisos del volumen de datos --------------
  # Docker crea los volúmenes nombrados como root. Como el resto de servicios
  # corre con uid 1001, necesitan que /data les pertenezca. Este servicio de
  # vida corta lo arregla y termina; los demás esperan a que lo complete.
  inicializador:
    image: alpine:3.19
    container_name: hw-init
    restart: "no"
    command:
      - sh
      - -c
      - |
        mkdir -p /data/uploads /data/outputs /data/tts-runtime
        chown -R 1000:1000 /data
        chmod -R 750 /data
        echo "Volumen /data preparado para uid 1000."
    volumes:
      - datos:/data
    networks:
      - portal
    security_opt:
      - no-new-privileges:true

  # --- Frontend: React compilado, servido por nginx ------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: herramientas-web-frontend:local
    container_name: hw-frontend
    restart: unless-stopped
    ports:
      # SOLO loopback. El acceso es vía túnel SSH.
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - portal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Backend: FastAPI, API HTTP ------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: herramientas-web-backend:local
    container_name: hw-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # `tts.py` invoca `piper` por nombre y lo busca en el PATH. El binario
      # vive en el venv de OpenClaw (montado en solo lectura).
      PATH: /home/node/.openclaw/workspace/venv/bin:/opt/venv/bin:/usr/local/bin:/usr/bin:/bin
    # Sin `ports:` → inalcanzable desde fuera. Solo por la red interna.
    expose:
      - "8000"
    volumes:
      - datos:/data
      # Workspace de OpenClaw (scripts, venv, modelos en tts_models/).
      # SOLO LECTURA: el portal nunca debe modificar los scripts del agente.
      # Se monta en la MISMA ruta que usa el shebang del venv para que
      # resuelva: /home/node/.openclaw/workspace/venv/bin/python
      # ⚠️ El backend es el ÚNICO servicio con el workspace en ESCRITURA.
      # Motivo: el panel de finanzas permite editar el ledger, y editar una
      # copia no serviría de nada (el agente seguiría viendo los datos viejos).
      # OpenClaw mantiene este volumen con escritura normal, así que el script
      # `finanzas.py` escribe el original directamente y no hace falta copiar.
      #
      # Nota: montar un subdirectorio en `:rw` sobre un padre `:ro` NO funciona
      # (Docker reemplaza el directorio por la raíz del volumen y el ledger
      # desaparece). Por eso la escritura es del montaje completo.
      #
      # El resto de servicios sí lo monta en `:ro`: no necesitan escribir.
      - openclaw-workspace:/home/node/.openclaw:rw
    depends_on:
      redis:
        condition: service_healthy
      inicializador:
        condition: service_completed_successfully
    networks:
      - portal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Worker ligero: TTS, visión, canción (segundos) ----------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: herramientas-web-backend:local
    container_name: hw-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      COLAS: rapida
      PATH: /home/node/.openclaw/workspace/venv/bin:/opt/venv/bin:/usr/local/bin:/usr/bin:/bin
    volumes:
      - datos:/data
      - openclaw-workspace:/home/node/.openclaw:ro
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      inicializador:
        condition: service_completed_successfully
    networks:
      - portal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Worker OCR: separador de PDFs (minutos, PaddleOCR + OpenCV) ---------
  # Imagen propia y pesada: PaddleOCR 2.7, paddlepaddle, OpenCV, PyMuPDF.
  # Se separa del worker ligero para que un OCR largo no bloquee el TTS.
  worker-ocr:
    build:
      context: ./backend
      dockerfile: Dockerfile.ocr
    image: herramientas-web-ocr:local
    container_name: hw-worker-ocr
    restart: unless-stopped
    # `python3`, no `python`: la imagen base es debian + apt python3 (para que el
    # venv de OpenClaw resuelva), donde no existe el alias `python`.
    command: ["python3", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      COLAS: pesada
      # PaddleOCR ARM64 necesita libgomp para el motor de inferencia.
      LD_LIBRARY_PATH: /opt/lib
      # ⚠️ PATH SIN el venv de OpenClaw, a diferencia del worker ligero.
      # El worker OCR ejecuta SU PROPIO código con el python del sistema; si el
      # venv va primero en el PATH, `python3` resuelve al venv montado y carga su
      # stdlib incompleta → `ModuleNotFoundError: No module named '_csv'`.
      # Los scripts del workspace se invocan por ruta ABSOLUTA (ver puente.py),
      # así que no necesitan estar en el PATH.
      PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
    volumes:
      - datos:/data
      # Necesario porque la cola pesada también transcribe: los scripts
      # (transcribir_av.py) y el intérprete viven aquí. Solo lectura.
      - openclaw-workspace:/home/node/.openclaw:ro
    depends_on:
      redis:
        condition: service_healthy
      inicializador:
        condition: service_completed_successfully
    networks:
      - portal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # El OCR es intensivo: 2 de las 4 vCPU y 4 GB, para dejar margen al resto.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Redis: cola de trabajos y caché -------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hw-redis
    restart: unless-stopped
    # Sin `ports:` → solo red interna.
    command:
      - redis-server
      - --save
      - "60 1"
      - --appendonly
      - "no"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - redis-data:/data
    networks:
      - portal
    security_opt:
      - no-new-privileges:true
    # Redis necesita SETUID/SETGID: su entrypoint usa setpriv para bajar de
    # root al usuario redis. Con cap_drop:ALL el contenedor reinicia en bucle
    # con "setpriv: setresuid failed: Operation not permitted".
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  portal:
    driver: bridge
    # Red propia y aislada: no toca dokploy-network ni la del proxy.
    internal: false

volumes:
  # Workspace de OpenClaw (scripts, venv, modelos). Es un volumen EXTERNO que
  # ya existe en el host: se declara `external` para que compose no lo cree ni
  # lo borre, y se monta en solo lectura en los servicios que lo necesitan.
  openclaw-workspace:
    external: true
    name: agente-openclaw-sh6xwb_openclaw_data
  # Datos compartidos entre backend, worker y worker-ocr.
  # Se prepara con el servicio `inicializador` para que el uid 1001 pueda
  # escribir: Docker crea los volúmenes nuevos como root.
  datos:
  redis-data:
