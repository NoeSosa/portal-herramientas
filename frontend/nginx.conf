# =============================================================================
# nginx — sirve el SPA y proxya /api al backend
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Resolución dinámica del upstream ---------------------------------
    # ⚠️ IMPRESCINDIBLE: sin esto nginx resuelve `backend` UNA vez al arrancar
    # y cachea la IP para siempre. Cuando el backend se recrea cambia de IP y
    # nginx devuelve 502 "Connection refused" apuntando a la IP vieja.
    #
    # 127.0.0.11 es el DNS interno de Docker. Con `resolver` + variable en
    # proxy_pass, nginx re-resuelve en cada petición.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Cabeceras de seguridad -------------------------------------------
    # El portal nunca debe enmarcarse ni cargar recursos de terceros.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP estricta.
    # El único recurso externo permitido son las tipografías de Google Fonts
    # (style-src y font-src restringen los dominios exactos). Si algún día se
    # quieren servir localmente, basta con quitarlos de aquí.
    # 'unsafe-inline' en style es necesario por los estilos de Vite/React;
    # si se migra a CSS con hashes, se puede endurecer.
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        always;

    # --- Compresión --------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # --- Salud -------------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- API ---------------------------------------------------------------
    # Límite de subida coherente con el backend.
    client_max_body_size 55m;

    location /api/ {
        # La variable fuerza la re-resolución del DNS en cada petición.
        # Con `proxy_pass http://backend:8000/...` literal, nginx cachea la IP.
        set $upstream_backend "http://backend:8000";
        proxy_pass $upstream_backend$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las herramientas pesadas tardan: no cortar la conexión antes.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }

    # --- Estáticos con hash: caché larga -----------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA fallback ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
